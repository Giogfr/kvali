name: Build nationwide routing package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, for example routing-data-2026-10-22'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kvali
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OSM parser
        run: python -m pip install --disable-pip-version-check osmium

      - name: Download current Georgia extract
        run: curl --fail --location --retry 4 --retry-delay 5 --output georgia-latest.osm.pbf https://download.geofabrik.de/asia/georgia-latest.osm.pbf

      - name: Build and verify graph
        run: |
          mkdir -p artifacts
          python scripts/build-georgia-routing-graph.py \
            --pbf georgia-latest.osm.pbf \
            --output artifacts/georgia-routing-graph-v2.json.gz
          test -s artifacts/georgia-routing-graph-v2.json.gz
          test -s artifacts/georgia-routing-graph-v2.json.gz.sha256

      - name: Publish graph release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            routing-data-*) ;;
            *) echo "release_tag must start with routing-data-"; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            artifacts/georgia-routing-graph-v2.json.gz \
            artifacts/georgia-routing-graph-v2.json.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nationwide Georgia routing data $RELEASE_TAG" \
            --notes "Generated from the current Geofabrik Georgia OpenStreetMap extract. The app verifies the SHA-256 sidecar before installing it."
