name: Build nationwide routing package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example routing-data-latest'
        required: true
        default: 'routing-data-latest'
        type: string

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kvali
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OSM parser
        run: python -m pip install --disable-pip-version-check osmium

      - name: Download current Georgia extract
        run: curl --fail --location --retry 4 --retry-delay 5 --output georgia-latest.osm.pbf https://download.geofabrik.de/europe/georgia-latest.osm.pbf

      - name: Build and verify graph
        run: |
          mkdir -p artifacts
          python scripts/build-georgia-routing-graph.py \
            --pbf georgia-latest.osm.pbf \
            --output artifacts/georgia-routing-graph-v3.kvr.gz
          test -s artifacts/georgia-routing-graph-v3.kvr.gz
          test -s artifacts/georgia-routing-graph-v3.kvr.gz.sha256

      - name: Publish graph release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            routing-data-*) ;;
            *) echo "release_tag must start with routing-data-"; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              artifacts/georgia-routing-graph-v3.kvr.gz \
              artifacts/georgia-routing-graph-v3.kvr.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/georgia-routing-graph-v3.kvr.gz \
              artifacts/georgia-routing-graph-v3.kvr.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nationwide Georgia routing data" \
              --notes "Generated from the current Geofabrik Georgia OpenStreetMap extract. The app verifies the SHA-256 sidecar before installing it."
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp artifacts/georgia-routing-graph-v3.kvr.gz _site/
          cp artifacts/georgia-routing-graph-v3.kvr.gz.sha256 _site/
          curl --fail --location --retry 4 --retry-delay 5 \
            -o _site/georgia-basemap-z13.pmtiles \
            https://giogfr.github.io/kvali/georgia-basemap-z13.pmtiles || true
          curl --fail --location --retry 4 --retry-delay 5 \
            -o _site/georgia-basemap-z13.pmtiles.sha256 \
            https://giogfr.github.io/kvali/georgia-basemap-z13.pmtiles.sha256 || true
          curl --fail --location --retry 4 --retry-delay 5 \
            -o _site/georgia-search-v1.json.gz \
            https://giogfr.github.io/kvali/georgia-search-v1.json.gz || true
          curl --fail --location --retry 4 --retry-delay 5 \
            -o _site/georgia-search-v1.json.gz.sha256 \
            https://giogfr.github.io/kvali/georgia-search-v1.json.gz.sha256 || true
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Kvali routing data</title>
          <p>Nationwide Georgia routing, basemap and search packages for the Kvali Android app.</p>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy routing data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
